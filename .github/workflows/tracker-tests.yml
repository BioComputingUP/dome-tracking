name: tracker-tests

on:
  push:
    branches: [main]
    paths: ["tracker/**", ".github/workflows/tracker-*.yml"]
  pull_request:
    paths: ["tracker/**", ".github/workflows/tracker-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tracker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tracker/requirements.txt
            tracker/requirements-dev.txt
      - run: pip install -r tracker/requirements.txt -r tracker/requirements-dev.txt
      - run: python -m pytest tracker/tests -q
